name: ACD Execution Optimization

on:
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/requirements-acd.txt
      - name: Install dependencies
        run: pip install -r research/requirements-acd.txt
      - name: Run execution optimization
        run: python research/acd_optimize_execution.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: acd-execution-optimization-results
          path: artifacts_execution/
          if-no-files-found: error
          retention-days: 14
