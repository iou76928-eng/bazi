name: ACD Gold Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/requirements-acd.txt
      - name: Install dependencies
        run: pip install -r research/requirements-acd.txt
      - name: Run multi-year XAUUSD validation
        run: python research/acd_backtest_multiyear.py
      - name: Upload multi-year results
        uses: actions/upload-artifact@v4
        with:
          name: acd-multiyear-results
          path: artifacts_multiyear/
          if-no-files-found: error
          retention-days: 14
