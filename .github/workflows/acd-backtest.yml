name: ACD Gold Backtest

on:
  push:
    branches:
      - research/acd-backtest-20260717
    paths:
      - 'research/acd_backtest.py'
      - 'research/requirements-acd.txt'
      - '.github/workflows/acd-backtest.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/requirements-acd.txt
      - name: Install dependencies
        run: pip install -r research/requirements-acd.txt
      - name: Run ACD parameter screen
        run: python research/acd_backtest.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: acd-backtest-results
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
