name: ACD Candidate Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/requirements-acd.txt
      - name: Install dependencies
        run: pip install -r research/requirements-acd.txt
      - name: Run candidate validation
        run: python research/acd_validate_candidates.py
      - name: Upload candidate results
        uses: actions/upload-artifact@v4
        with:
          name: acd-candidate-results
          path: artifacts_candidates/
          if-no-files-found: error
          retention-days: 14
